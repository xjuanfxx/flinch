<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="#0B0C12"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <!-- the F, as one path, built on a slight forward slant -->
    <g id="F">
      <path d="M170 116 H360 L346 182 H244 L236 222 H326 L312 288 H222 L200 396 H122 Z"/>
    </g>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <g clip-path="url(#tile)">
    <!-- scan lines -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
      <line x1="0" y1="140" x2="512" y2="140"/><line x1="0" y1="160" x2="512" y2="160"/>
      <line x1="0" y1="300" x2="512" y2="300"/><line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="420" x2="512" y2="420"/>
    </g>
    <!-- RGB split ghosts -->
    <use href="#F" fill="#B8FF2E" transform="translate(-14 0)" opacity="0.9"/>
    <use href="#F" fill="#7B5CFF" transform="translate(14 0)" opacity="0.9"/>
    <!-- main F, sliced: three bands, middle band jolted -->
    <clipPath id="b1"><rect x="0" y="0" width="512" height="214"/></clipPath>
    <clipPath id="b2"><rect x="0" y="214" width="512" height="30"/></clipPath>
    <clipPath id="b3"><rect x="0" y="244" width="512" height="300"/></clipPath>
    <g fill="#F5F2EA">
      <use href="#F" clip-path="url(#b1)"/>
      <g clip-path="url(#b2)"><use href="#F" transform="translate(30 0)"/></g>
      <use href="#F" clip-path="url(#b3)"/>
    </g>
    <!-- jolt ticks -->
    <g fill="#F5F2EA">
      <rect x="378" y="218" width="54" height="8" rx="4"/>
      <rect x="398" y="234" width="30" height="8" rx="4" opacity="0.55"/>
      <rect x="82" y="300" width="34" height="8" rx="4" opacity="0.55"/>
    </g>
  </g>
</svg>
