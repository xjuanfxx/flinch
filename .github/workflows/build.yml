name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Flinch-windows
          path: build/Release/Flinch.aex

  macos:
    runs-on: macos-14  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify and sign (ad hoc)
        run: |
          plugin=$(find build -name 'Flinch.plugin' -type d | head -n 1)
          echo "Bundle: $plugin"
          lipo -info "$plugin/Contents/MacOS/Flinch"
          test -s "$plugin/Contents/Resources/Flinch.rsrc"
          codesign --force --deep --sign - "$plugin"
          codesign --verify --verbose "$plugin"
          mkdir -p dist
          ditto -c -k --keepParent "$plugin" dist/Flinch-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flinch-macos
          path: dist/Flinch-macos.zip
